<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>K-ON – Kantin Online</title>
<style>
:root{--o:#ff8a3d;--p:#ff5fa2;--b:#18c4d8;--bd:#0aa5bb;--g:#35c759;--y:#ffd23f;--v:#8b5cf6;--ink:#2b2f55;--sh:0 8px 22px rgba(10,165,187,.2)}
*{box-sizing:border-box}
body{margin:0;font-family:"Comic Sans MS","Segoe UI",sans-serif;color:var(--ink);background:#eef6f8;padding-bottom:150px}
h2{margin:8px 0}h3{margin:18px 0 8px}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 16px 22px;background:linear-gradient(120deg,#18c4d8,#2eb8ff 60%,#8b5cf6);border-radius:0 0 32px 32px;box-shadow:0 5px 0 var(--y),0 10px 0 var(--p);color:#fff}
.brand{flex:1;font-size:26px;font-weight:900;text-shadow:2px 2px 0 rgba(0,0,0,.18)}
.brand small{display:block;font-size:13px;font-weight:600;text-shadow:none;opacity:.95}
.ib{position:relative;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.28);color:#fff;font-size:20px;cursor:pointer;flex-shrink:0}
.bd{position:absolute;top:-4px;right:-4px;background:var(--p);color:#fff;font:700 12px/20px "Comic Sans MS",sans-serif;min-width:20px;border-radius:10px;font-style:normal}
.logo{width:58px;height:58px;cursor:pointer;filter:drop-shadow(0 3px 0 rgba(0,0,0,.22));user-select:none;transition:transform .15s;flex-shrink:0}
.logo:active{transform:scale(.85) rotate(-12deg)}
.wrap{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:18px 14px}
.hero{border-radius:28px;padding:22px;color:#fff;background:linear-gradient(120deg,var(--v),var(--p));position:relative;font-size:21px;font-weight:700;box-shadow:var(--sh)}
.chips{display:flex;gap:10px;margin:14px 0;overflow-x:auto;padding:4px 2px 10px}
.chip{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:78px;border:0;border-radius:20px;padding:8px 14px;font:inherit;font-weight:700;background:#fff;color:var(--ink);cursor:pointer;box-shadow:var(--sh);white-space:nowrap}
.chip span{font-size:26px}.chip.on{background:var(--b);color:#fff}
.ph{position:relative;display:grid;place-items:center;overflow:hidden;flex-shrink:0}
.pl{display:grid;place-items:center;width:58%;aspect-ratio:1;border-radius:50%;background:#fff;box-shadow:0 6px 14px rgba(0,0,0,.18);font-size:46px}
.ph.big{aspect-ratio:3/2;border-radius:30px}.big .pl{font-size:96px;width:46%}
.ph.cp{aspect-ratio:3/2}.ph.kp{aspect-ratio:16/9}.ph.th{width:84px;aspect-ratio:3/2;border-radius:14px}.th .pl{font-size:24px;box-shadow:none;width:60%}
.fh{position:relative;width:min(100%,520px);margin:0 auto;border-radius:30px;overflow:hidden;box-shadow:var(--sh)}
.hov{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:10px;padding:36px 14px 14px;background:linear-gradient(transparent,rgba(20,20,60,.78));color:#fff}
.hov div{flex:1}.hov b{display:block;font-size:22px}
.pill{background:var(--y);color:var(--ink);border-radius:18px;padding:4px 12px;font-weight:900}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.strip{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 14px;scroll-snap-type:x proximity}.strip .card{width:170px;flex-shrink:0;scroll-snap-align:start}
.card,.kc{position:relative;background:#fff;border-radius:24px;box-shadow:var(--sh);overflow:hidden;text-align:center}
.ci{padding:10px 12px 14px}.ci b{display:block}.ci small{display:block;margin-bottom:8px;opacity:.7}
.pr{position:absolute;top:10px;right:10px;background:var(--ink);color:#fff;border-radius:16px;padding:3px 10px;font-weight:700;font-size:13px}
.btn{border:0;border-radius:18px;padding:8px 14px;font:inherit;font-weight:700;color:#fff;background:var(--g);cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.p{background:var(--p)}.btn.o{background:var(--o)}.btn.b{background:var(--b)}.btn.r{background:#e5484d}
.qty{display:flex;justify-content:center;align-items:center;gap:12px;font-weight:900;font-size:18px}
.sold:after{content:"HABIS";position:absolute;inset:0;background:rgba(255,255,255,.82);display:grid;place-items:center;font-size:26px;font-weight:900;color:#e5484d;transform:rotate(-8deg)}
.bar{position:fixed;left:0;right:0;bottom:72px;display:flex;justify-content:center;z-index:6}
.nav{position:fixed;left:0;right:0;bottom:0;height:62px;display:flex;background:#fff;border-radius:24px 24px 0 0;box-shadow:0 -6px 18px rgba(10,165,187,.25);z-index:6;overflow:hidden}
.nav button{flex:1;border:0;background:none;font:inherit;font-weight:700;font-size:16px;cursor:pointer;color:var(--ink)}
.nav .on{color:var(--bd);box-shadow:inset 0 -5px 0 var(--p)}
.ov{position:fixed;inset:0;background:rgba(43,47,85,.6);display:grid;place-items:center;z-index:9;padding:14px}
.box{background:#fff;border-radius:30px;padding:20px;width:100%;max-width:440px;max-height:90vh;overflow:auto;border:4px solid var(--b)}
input,select{width:100%;padding:10px;margin:5px 0 10px;border:3px solid var(--b);border-radius:14px;font:inherit}
.ord{background:#fff;border-radius:24px;padding:14px;margin-bottom:12px;border:3px solid var(--b);box-shadow:var(--sh)}
.steps{display:flex;gap:4px;margin:8px 0}.steps i{flex:1;height:10px;border-radius:6px;background:#e6e0f0}.steps i.d{background:var(--g)}
.stat{display:flex;gap:10px;flex-wrap:wrap}.stat div{flex:1;min-width:130px;padding:14px;border-radius:22px;color:#fff;font-weight:700;text-align:center;box-shadow:var(--sh)}.stat b{display:block;font-size:24px}
.kg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;margin-top:16px}
.kc{cursor:pointer;font-weight:800;font-size:20px;transition:transform .15s}.kc:hover{transform:translateY(-4px) rotate(-1deg)}.kc .pl{font-size:64px;width:40%}
.opt{display:flex;gap:8px;margin-bottom:10px}.opt label{flex:1;border:3px solid var(--b);border-radius:16px;padding:8px;text-align:center;cursor:pointer;font-weight:700}.opt input{width:auto;margin:0 6px 0 0}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.row input,.row select{width:auto;margin:2px 0;padding:6px}
table{width:100%;border-collapse:collapse}td,th{padding:6px;text-align:left;border-bottom:2px dashed #e6e0f0}
.lr{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:2px dashed #e6e0f0}
.ph img,.pf img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none;pointer-events:none}
.pf{position:relative;width:100%;overflow:hidden;border-radius:20px;background:#fff;border:3px dashed var(--b);touch-action:none;cursor:grab;margin-bottom:8px}
input[type=range]{padding:0;border:0}
.kc.closed .ph{filter:grayscale(1)}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><symbol id="lgs" viewBox="0 0 100 100"><defs><linearGradient id="gr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd23f"/><stop offset="1" stop-color="#ff5fa2"/></linearGradient></defs><circle cx="50" cy="50" r="47" fill="url(#gr)" stroke="#fff" stroke-width="4"/><path d="M36 24q-6 6 0 12M50 18q-6 7 0 14M64 24q-6 6 0 12" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M17 46h66a33 31 0 0 1-66 0z" fill="#2eb8ff" stroke="#fff" stroke-width="3" stroke-linejoin="round"/><ellipse cx="50" cy="46" rx="33" ry="6" fill="#ff8a3d" stroke="#fff" stroke-width="3"/><circle cx="39" cy="60" r="3.5" fill="#3b2a5a"/><circle cx="61" cy="60" r="3.5" fill="#3b2a5a"/><path d="M43 67q7 7 14 0" stroke="#3b2a5a" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="32" cy="66" r="4" fill="#ff5fa2" opacity=".7"/><circle cx="68" cy="66" r="4" fill="#ff5fa2" opacity=".7"/><text x="50" y="92" font-size="13" font-weight="900" text-anchor="middle" fill="#fff" stroke="#8b5cf6" stroke-width="2" paint-order="stroke" font-family="Comic Sans MS,Arial">K-ON</text></symbol></svg>
<div id="app"></div><div id="m"></div>
<script>
// Akun tiap kantin (username & password penjual). Tambah kantin baru = tambah satu baris di sini.
const KT=[{id:1,n:'Kantin Ibu Dyah',e:'🍲',c:'#ff8a3d',u:'Ibu Dyah',p:'ibudyah1'},{id:2,n:'Kantin Pelangi',e:'🌈',c:'#ff5fa2',u:'Kantin Pelangi',p:'Viska06'},{id:3,n:'Kantin Hebat',e:'💪',c:'#2eb8ff',u:'Hebatt',p:'Hebat01'}];
const ONG=2000; // biaya pengantaran per pesanan yang diantar ke kelas
const $=s=>document.querySelector(s),mem={};
const S={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return k in mem?mem[k]:d}},set(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){alert('Penyimpanan browser penuh. Gunakan foto yang lebih kecil atau hapus beberapa foto menu.')}}};
// [kantin, nama, emoji, harga jual, harga modal, kategori]
const DEF=[[1,'Nasi Pecel','🥗',8000,5000,'Makanan'],[1,'Soto Ayam','🍲',12000,8000,'Makanan'],[1,'Ayam Goreng','🍗',13000,9000,'Makanan'],[1,'Gado-gado','🥬',9000,6000,'Makanan'],[1,'Kerupuk','🍘',2000,1000,'Snack'],[1,'Es Teh Manis','🧋',3000,1000,'Minuman'],[1,'Es Jeruk','🍊',4000,2000,'Minuman'],
[2,'Nasi Goreng','🍳',10000,6500,'Makanan'],[2,'Mie Ayam','🍜',12000,8000,'Makanan'],[2,'Bakso','🍢',10000,6500,'Makanan'],[2,'Roti Bakar','🍞',7000,4000,'Snack'],[2,'Jus Jeruk','🍊',6000,3500,'Minuman'],[2,'Susu Coklat','🥛',5000,3500,'Minuman'],[2,'Es Buah','🍧',7000,4000,'Minuman'],
[3,'Burger Mini','🍔',9000,5500,'Makanan'],[3,'Nasi Kuning','🍛',9000,6000,'Makanan'],[3,'Sosis Bakar','🌭',6000,3500,'Snack'],[3,'Kentang Goreng','🍟',6000,3000,'Snack'],[3,'Es Teh','🧋',3000,1000,'Minuman'],[3,'Milkshake','🥤',8000,4500,'Minuman']].map(([k,n,e,h,m,c],i)=>({id:i+1,k,n,e,h,m,c}));
const COL=['#ff8a3d','#ff5fa2','#2eb8ff','#35c759','#8b5cf6','#ffd23f'];
let menu,orders,mine,exp,off,hpp,qrs,odt='',hm=0,cart={},cat='Semua',tab='home',kt=0,seller=0,dtab='ord',per='h',taps=0,tt;
const load=()=>{menu=S.get('kon2_menu',DEF);orders=S.get('kon2_orders',[]);mine=S.get('kon2_mine',[]);exp=S.get('kon2_exp',[]);off=S.get('kon2_off',[]);hpp=S.get('kon2_hpp',{});qrs=S.get('kon2_qr',{});const t=S.get('kon2_kt',{});KT.forEach(k=>{k.n0=k.n0||k.n;k.n=(t[k.id]||{}).n||k.n0;k.i=(t[k.id]||{}).i;k.px=(t[k.id]||{}).px;k.py=(t[k.id]||{}).py;k.pz=(t[k.id]||{}).pz;k.open=(t[k.id]||{}).o!==false})};
const rp=n=>(n<0?'-':'')+'Rp'+Math.abs(n).toLocaleString('id-ID'),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LG=(a='')=>`<svg class="logo" ${a}><use href="#lgs"/></svg>`,modal=h=>{$('#m').innerHTML=h?`<div class="ov"><div class="box">${h}</div></div>`:''};
const stt=o=>o.st==2?(o.dl?'Sedang diantar ke kelas 🛵':'Siap diambil 🎉'):['Menunggu konfirmasi 🕐','Sedang dimasak 👩‍🍳','','Selesai ✅','Dibatalkan ❌'][o.st];
const kn=id=>(KT.find(k=>k.id==id)||{}).n,lines=o=>o.items.map(x=>x.e+' '+esc(x.n)+' ×'+x.q).join(', ')+(o.ong?' • 🛵 Ongkir '+rp(o.ong):''),draw=()=>{if(!seller&&kt&&!(KT.find(k=>k.id==kt)||{}).open){kt=0;cart={};modal();alert('Maaf, kantin ini sedang tutup 🙏')}$('#app').innerHTML=seller?dash():home()};

function home(){
 const K=KT.find(k=>k.id==kt),H=tab=='home',cs={Semua:'🌟',Makanan:'🍱',Minuman:'🥤',Snack:'🍿'};
 const n=Object.values(cart).reduce((a,b)=>a+b,0),tot=Object.entries(cart).reduce((s,[i,q])=>s+q*(menu.find(m=>m.id==i)||{h:0}).h,0);
 const cd=(m,i)=>`<div class="card ${m.x?'sold':''}">${pic(m,'cp',i)}<span class="pr">${rp(m.h)}</span><div class="ci"><b>${esc(m.n)}</b><small>${m.c}</small>${cart[m.id]?`<div class="qty"><button class="btn o" onclick="add(${m.id},-1)">−</button>${cart[m.id]}<button class="btn" onclick="add(${m.id},1)">+</button></div>`:`<button class="btn" onclick="add(${m.id},1)">+ Pesan</button>`}</div></div>`;
 let h=`<div class="top">${H&&K?`<button class="ib" onclick="kt=0;cart={};draw()">←</button>`:''}<div class="brand">${H&&K?K.e+' '+K.n:'K-ON 🎈'}<small>${H&&K?'Pilih jajananmu!':'Kantin Online Sekolah'}</small></div>${H&&K?`<button class="ib" onclick="co()">🛒${n?`<i class="bd">${n}</i>`:''}</button>`:''}${LG('onclick="tap()"')}</div><div class="wrap">`;
 if(H&&!K)h+=`<div class="hero">Halo, teman! 👋<br>Mau jajan di kantin mana hari ini?</div><div class="kg">${KT.map(k=>`<div class="kc ${k.open?'':'closed'}" onclick="${k.open?`kt=${k.id};cart={};cat='Semua';draw()`:`alert('Kantin sedang tutup. Coba lagi nanti ya!')`}">${pic(k,'kp')}<span class="pr" style="background:${k.open?'var(--g)':'#e5484d'}">${k.open?'🟢 Buka':'🔴 Tutup'}</span><div class="ci"><b>${k.n}</b><small>${k.open?menu.filter(m=>m.k==k.id&&!m.x).length+' menu tersedia':'Sedang tutup'}</small></div></div>`).join('')}</div>`;
 else if(H){
  const ml=menu.filter(m=>m.k==kt),sold={};orders.filter(o=>o.k==kt&&o.st!=4).forEach(o=>o.items.forEach(x=>sold[x.n]=(sold[x.n]||0)+x.q));
  const rk=ml.filter(m=>!m.x).sort((a,b)=>(sold[b.n]||0)-(sold[a.n]||0)),f=rk[0],all=cat=='Semua';
  h+=`<div class="chips">${Object.keys(cs).map(c=>`<button class="chip ${c==cat?'on':''}" onclick="cat='${c}';draw()"><span>${cs[c]}</span>${c}</button>`).join('')}</div>`;
  if(f&&all)h+=`<div class="fh">${pic(f,'big')}<div class="hov"><div><small>${sold[f.n]?'🔥 Terlaris':'⭐ Rekomendasi'}</small><b>${esc(f.n)}</b></div><span class="pill">${rp(f.h)}</span><button class="btn p" onclick="add(${f.id},1)">+ Pesan</button></div></div>`;
  if(all&&rk.length>1)h+=`<h3>🔥 Rekomendasi</h3><div class="strip">${rk.slice(1,7).map(cd).join('')}</div>`;
  h+=`<h3>${all?'📋 Semua Menu':cat}</h3><div class="grid">${ml.filter(m=>all||m.c==cat).map(cd).join('')||'<p>Belum ada menu.</p>'}</div>`}
 
else{const l=orders.filter(o=>mine.includes(o.id)).reverse();h+=`<h2>📦 Pesanan Saya</h2>`+(l.length?l.map(o=>`<div class="ord"><b>#${o.id} • ${kn(o.k)}</b><div>${esc(o.nm)} (${esc(o.kl)}) • ${o.dl?'🛵 Diantar ke kelas':'🚶 Diambil sendiri'} • ${o.pay?'📱 QR Code':'💵 Tunai'}</div><div>${lines(o)}</div><div class="steps">${[0,1,2,3].map(k=>`<i class="${o.st<4&&o.st>=k?'d':''}"></i>`).join('')}</div><b>${stt(o)}</b><span style="float:right;font-weight:700">${rp(o.tot)}</span></div>`).join(''):'<p>Belum ada pesanan. Yuk jajan dulu! 🍭</p>')}
 h+='</div>';
 if(n&&tab=='home')h+=`<div class="bar"><button class="btn p" style="font-size:18px;padding:12px 28px" onclick="co()">🛒 ${n} item • ${rp(tot)} — Lanjut</button></div>`;
 return h+`<div class="nav"><button class="${tab=='home'?'on':''}" onclick="tab='home';draw()">🏠 Jajan</button><button class="${tab=='ord'?'on':''}" onclick="tab='ord';draw()">📦 Pesanan Saya</button></div>`}
function add(i,d){const m=menu.find(x=>x.id==i);if(!m||m.x)return;const q=(cart[i]||0)+d;q>0?cart[i]=q:delete cart[i];draw()}
function co(){
 const g=id=>($('#'+id)||{}).value||'',V={nm:g('nm'),kl:g('kl'),ct:g('ct'),dl:($('input[name=dl]:checked')||{}).value||'0',py:($('input[name=py]:checked')||{}).value||'0'};
 const ids=Object.keys(cart).filter(i=>menu.find(x=>x.id==i));
 if(!ids.length)return modal(`<h2>🛒 Keranjang</h2><p>Keranjang masih kosong. Yuk pilih menu! 😋</p><button class="btn b" style="width:100%" onclick="modal()">Tutup</button>`);
 const tot=ids.reduce((s,i)=>s+cart[i]*menu.find(x=>x.id==i).h,0),ck=(n,v,l)=>`<label><input type="radio" name="${n}" value="${v}" ${V[n]==v?'checked':''}${n=='py'?' onchange="pq()"':n=='dl'?' onchange="pgo()"':''}>${l}</label>`;
 modal(`<h2>🛒 Keranjang — ${kn(kt)}</h2>`+ids.map(i=>{const m=menu.find(x=>x.id==i);return `<div class="row" style="flex-wrap:nowrap;margin-bottom:8px">${pic(m,'th')}<div style="flex:1"><b>${esc(m.n)}</b><br><small>${rp(m.h)}</small></div><div class="qty"><button class="btn o" onclick="add(${i},-1);co()">−</button>${cart[i]}<button class="btn" onclick="add(${i},1);co()">+</button></div></div>`}).join('')+`<div class="lr"><span>Subtotal</span><span>${rp(tot)}</span></div><div class="lr" id="ogr" style="display:${V.dl==1?'flex':'none'}"><span>🛵 Biaya pengantaran</span><span>${rp(ONG)}</span></div><div class="lr"><b>Total</b><b id="tt">${rp(tot+(V.dl==1?ONG:0))}</b></div><label>Nama</label><input id="nm" maxlength="30" value="${esc(V.nm)}"><label>Kelas</label><input id="kl" maxlength="10" placeholder="contoh: 5A" value="${esc(V.kl)}"><label>Pengambilan</label><div class="opt">${ck('dl',0,'🚶 Diambil Sendiri')}${ck('dl',1,'🛵 Diantar ke Kelas')}</div><label>Pembayaran</label><div class="opt">${ck('py',0,'💵 Tunai')}${ck('py',1,'📱 QR Code')}</div><div id="qrb" style="display:${V.py==1?'block':'none'};text-align:center;margin-bottom:10px">${qrImg(kt)}<br><small>Scan QR ${kn(kt)}, lalu tunjukkan bukti bayar ke penjual.</small></div><label>Catatan (boleh kosong)</label><input id="ct" maxlength="60" placeholder="contoh: tidak pedas" value="${esc(V.ct)}"><button class="btn p" style="width:100%;font-size:18px" onclick="send()">🚀 Pesan Sekarang</button><button class="btn b" style="width:100%;margin-top:8px" onclick="modal()">Kembali</button>`)}
function send(){const nm=$('#nm').value.trim(),kl=$('#kl').value.trim();if(!nm||!kl)return alert('Isi nama dan kelas dulu ya! 😊');
 load();if(!(KT.find(k=>k.id==kt)||{}).open){alert('Maaf, kantin sedang tutup 🙏');return draw()}const items=Object.entries(cart).map(([i,q])=>{const m=menu.find(x=>x.id==i);return m&&!m.x?{n:m.n,e:m.e,h:m.h,m:m.m||0,q}:null}).filter(Boolean);if(!items.length)return alert('Menu yang kamu pilih sudah habis 😢');
 const id=orders.length?orders[orders.length-1].id+1:1;
 orders.push({id,k:kt,nm,kl,dl:+$('input[name=dl]:checked').value,pay:+$('input[name=py]:checked').value,ct:$('#ct').value.trim(),items,ong:ONG*(+$('input[name=dl]:checked').value),tot:items.reduce((s,x)=>s+x.h*x.q,0)+ONG*(+$('input[name=dl]:checked').value),st:0,t:Date.now()});mine.push(id);
 S.set('kon2_orders',orders);S.set('kon2_mine',mine);cart={};modal();tab='ord';draw()}

function tap(){taps++;clearTimeout(tt);tt=setTimeout(()=>taps=0,3000);if(taps>=10){taps=0;modal(`<h2>🔐 Masuk Penjual</h2><input id="lu" placeholder="Username" autocomplete="off"><input id="lp" type="password" placeholder="Password"><button class="btn p" style="width:100%" onclick="login()">Masuk</button><button class="btn b" style="width:100%;margin-top:8px" onclick="modal()">Batal</button>`)}}
function login(){const k=KT.find(k=>k.u==$('#lu').value&&k.p==$('#lp').value);if(k){modal();seller=k.id;dtab='ord';draw()}else alert('Username atau password salah.')}

<div class="ord"><b>3. Biaya operasional</b><div class="ord" style="background:#fff7e6;margin-top:8px"><b>👩‍🍳 Biaya tenaga kerja</b><br><small>Cara menghitung: gaji per hari ÷ jumlah produk per hari. Contoh: Rp100.000 ÷ 500 = Rp200 per produk.</small>${I('g','Gaji per hari (Rp)')}${I('gp','Jumlah produk per hari')}</div><div class="ord" style="background:#fff7e6"><b>💡 Biaya overhead</b><br><small>Cara menghitung: total biaya bulanan (listrik, sewa, dll) ÷ jumlah produksi. Contoh: Rp2.000.000 ÷ 10.000 = Rp200 per produk.</small>${I('v','Total biaya bulanan (Rp)')}${I('vp','Jumlah produksi per bulan')}</div></div>
<div class="ord"><b>4. Jumlah produk yang dihasilkan</b><br><small>Jumlah produk jadi dari semua bahan di nomor 2.</small>${I('o','Jumlah produk')}</div>`}
<div class="ord" style="border-color:var(--g)"><b>📋 Hasil perhitungan HPP</b><div id="hr">${hr()}</div></div>`}

const GR=['#ff8a3d,#ffd23f','#ff5fa2,#ffb199','#18c4d8,#8be9fd','#35c759,#b8f27b','#8b5cf6,#d6b8ff','#ffd23f,#ff9a8b'];
const pic=(m,c='',i=0)=>m.i?`<div class="ph ${c}" style="background:#fff"><img src="${m.i}" alt="" style="transform:translate(${m.px||0}%,${m.py||0}%) scale(${m.pz||1})"></div>`:`<div class="ph ${c}" style="background:linear-gradient(135deg,${GR[(m.id+i)%6]})"><span class="pl">${esc(m.e)}</span></div>`;
function upI(el,id){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,420/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);load();const m=menu.find(x=>x.id==id);if(m){m.i=c.toDataURL('image/jpeg',.78);m.px=0;m.py=0;m.pz=1;sv()}};im.onerror=()=>alert('File gambar tidak bisa dibaca.');im.src=r.result};r.readAsDataURL(f)}
function rmI(id){load();const m=menu.find(x=>x.id==id);if(m){delete m.i;sv()}}
function rz(f,max,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.78))};im.onerror=()=>alert('File gambar tidak bisa dibaca.');im.src=r.result};r.readAsDataURL(f)}
function kSave(o,del){const t=S.get('kon2_kt',{}),e=t[seller]=t[seller]||{};Object.assign(e,o);if(del)delete e[del];S.set('kon2_kt',t);load();draw()}
const kName=v=>kSave({n:v.trim()||undefined}),kRm=()=>kSave({},'i'),kPhoto=el=>{const f=el.files[0];if(f)rz(f,640,d=>kSave({i:d,px:0,py:0,pz:1}))};
function kpTab(){const K=KT.find(k=>k.id==seller);return `<div class="ord"><b>🏪 Profil Kantin</b><div style="margin:10px 0;border-radius:20px;overflow:hidden;max-width:420px">${pic(K,'kp')}</div><small>Foto dan nama ini tampil di halaman awal saat pelanggan memilih kantin. ${K.i?'':'Sekarang masih gambar contoh, ganti dengan foto asli kantinmu.'}</small><label style="display:block;margin-top:10px">Nama kantin</label><input maxlength="30" value="${esc(K.n)}" onchange="kName(this.value)"><div class="row"><label class="btn b" style="padding:6px 10px">📷 Ganti Foto Kantin<input type="file" accept="image/*" hidden onchange="kPhoto(this)"></label>${K.i?`<button class="btn p" onclick="ope('k',${K.id})">✋ Atur Posisi</button><button class="btn o" onclick="kRm()">Hapus foto</button>`:''}</div></div>`}
let ed2=null;
const pa=()=>{$('#pi').style.transform=`translate(${ed2.x}%,${ed2.y}%) scale(${ed2.z})`};
function ope(t,id){load();const o=t=='m'?menu.find(m=>m.id==id):KT.find(k=>k.id==id);if(!o||!o.i)return;ed2={t,id,x:o.px||0,y:o.py||0,z:o.pz||1};
 modal(`<h2>✋ Atur Posisi Foto</h2><div id="pf" class="pf" style="aspect-ratio:${t=='m'?'3/2':'16/9'}"><img id="pi" src="${o.i}" alt=""></div><small>Geser foto dengan mouse atau jari ke posisi yang kamu mau. Gunakan roda mouse atau slider untuk memperbesar dan memperkecil. Foto selalu ditampilkan utuh tanpa dipotong, kecuali kamu sendiri yang memperbesarnya.</small><label style="display:block;margin-top:8px">🔍 Zoom <input id="pz" type="range" min="0.4" max="4" step="0.05" value="${ed2.z}" oninput="ed2.z=+this.value;pa()"></label><div class="row"><button class="btn o" onclick="ed2.x=0;ed2.y=0;ed2.z=1;$('#pz').value=1;pa()">↺ Kembalikan</button></div><button class="btn p" style="width:100%;margin-top:8px" onclick="psv()">💾 Simpan Posisi</button><button class="btn b" style="width:100%;margin-top:8px" onclick="modal()">Batal</button>`);
 pa();const f=$('#pf');let s=null;
 f.onpointerdown=e=>{s={cx:e.clientX,cy:e.clientY,x:ed2.x,y:ed2.y};f.setPointerCapture(e.pointerId);f.style.cursor='grabbing'};
 f.onpointermove=e=>{if(!s)return;const r=f.getBoundingClientRect();ed2.x=s.x+(e.clientX-s.cx)/r.width*100;ed2.y=s.y+(e.clientY-s.cy)/r.height*100;pa()};
 f.onpointerup=f.onpointercancel=()=>{s=null;f.style.cursor='grab'};
 f.onwheel=e=>{e.preventDefault();ed2.z=Math.min(4,Math.max(.4,ed2.z-e.deltaY/1000));$('#pz').value=ed2.z;pa()}}
function psv(){const o=ed2,v={px:Math.round(o.x*10)/10,py:Math.round(o.y*10)/10,pz:Math.round(o.z*100)/100};if(o.t=='m'){load();const m=menu.find(x=>x.id==o.id);if(m){Object.assign(m,v);sv()}}else kSave(v);modal()}
function kOpen(){const K=KT.find(k=>k.id==seller);kSave({o:!K.open})}
addEventListener('keydown',e=>{if(e.key=='Enter'&&$('#lp'))login()});
addEventListener('storage',()=>{load();if(!/INPUT|SELECT/.test(document.activeElement.tagName))draw()});
load();draw();
</script></body></html>
